name: Core checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core-calculations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check syntax
        run: python -m compileall -q app.py graph.py tools rag tests
      - name: Check core calculations (no external API)
        run: python -m unittest discover -s tests -v
